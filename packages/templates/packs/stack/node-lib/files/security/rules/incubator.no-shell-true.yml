rules:
  - id: incubator.no-shell-true
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      Subprocesses must be spawned without a shell (shell:false, argument arrays). Use Exec from
      @incubator/runtime (ADR-008).
    patterns:
      - pattern: '$F(..., {..., shell: $S, ...})'
      - metavariable-pattern:
          metavariable: $S
          patterns:
            - pattern-not: 'false'
