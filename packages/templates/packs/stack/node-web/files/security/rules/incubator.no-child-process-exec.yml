rules:
  - id: incubator.no-child-process-exec
    languages: [javascript, typescript]
    severity: ERROR
    message: >-
      child_process.exec/execSync always run through a shell. Use spawn with shell:false via Exec
      from @incubator/runtime (ADR-008).
    pattern-either:
      - pattern: require('child_process').exec(...)
      - pattern: require('child_process').execSync(...)
      - patterns:
          - pattern-inside: |
              import { ..., exec, ... } from '$M';
              ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(node:)?child_process$
          - pattern: exec(...)
      - patterns:
          - pattern-inside: |
              import { ..., execSync, ... } from '$M';
              ...
          - metavariable-regex:
              metavariable: $M
              regex: ^(node:)?child_process$
          - pattern: execSync(...)
