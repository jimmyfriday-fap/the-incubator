name: security-scan

on:
  push:
    branches: ['**']
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # why: semgrep is installed from hash-locked wheels (tools/semgrep-requirements.txt), never a piped installer.
      - run: node scripts/tools-fetch.mjs semgrep
      # why: p/default instead of "auto" because auto forces metrics on; fixtures are excluded because they fire by design.
      - run: |
          mkdir -p scan-results
          .tools/venv/bin/semgrep scan --config p/default --config security/rules --exclude security/fixtures \
            --metrics off --disable-version-check --json --output scan-results/semgrep.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-semgrep
          path: scan-results/semgrep.json

  trivy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: HIGH,CRITICAL
          format: json
          output: scan-results/trivy.json
          exit-code: '0'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-trivy
          path: scan-results/trivy.json

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      # why: the gitleaks binary is hash-pinned in tools/tools.lock.json; gitleaks-action needs a paid licence for org repos.
      - run: node scripts/tools-fetch.mjs gitleaks
      # why: report everything with exit 0; the policy gate decides against the accepted-risk register.
      - run: |
          mkdir -p scan-results
          .tools/gitleaks/gitleaks git --no-banner --report-format json --report-path scan-results/gitleaks.json --exit-code 0 .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: scan-gitleaks
          path: scan-results/gitleaks.json

  rule-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - run: node scripts/tools-fetch.mjs semgrep
      - run: node scripts/guard/rule-fixtures.mjs

  policy-gate:
    needs: [semgrep, trivy, gitleaks, rule-fixtures]
    # why: the gate always runs so a missing report fails loudly instead of being skipped.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: scan-*
          merge-multiple: true
          path: scan-results
      - run: node scripts/guard/validate-scan-results.mjs --dir scan-results
      - run: node scripts/guard/policy-gate.mjs --dir scan-results
      - run: node scripts/guard/ci-gate.mjs
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
