name: promote-to-production

on:
  workflow_dispatch:
    inputs:
      execute_tasks:
        description: Merge and deploy for real (false = dry run that only prints the plan)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: promote-to-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 15
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # why: always show what would be promoted and which post-deploy tasks would run.
      - name: Plan
        run: |
          git fetch origin main production
          echo "Commits to promote:"
          git log --oneline origin/production..origin/main
          node scripts/run-deploy-tasks.mjs --env prod --sha "$(git rev-parse origin/main)"
      # why: dry run by default; only execute_tasks=true merges, with a Promote-Run trailer rollback relies on.
      - name: Merge main into production
        if: inputs.execute_tasks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout production
          git merge --no-ff origin/main -m "promote: main to production" -m "Promote-Run: ${GITHUB_RUN_ID}"
          git push origin production
      # why: deploy-production.yml has no push trigger; this explicit dispatch is the only way to deploy prod.
      - name: Dispatch deploy-production
        if: inputs.execute_tasks
        run: gh workflow run deploy-production.yml --ref production -f promote_run="${GITHUB_RUN_ID}"
        env:
          GH_TOKEN: ${{ github.token }}
