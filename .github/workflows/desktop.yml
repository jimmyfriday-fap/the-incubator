name: desktop

# Builds the Electron app on all three OSes, smoke-tests the packaged executables and keeps the
# installers as artifacts (TDD §9.3, Phase 6). Builds are unsigned (open question Q5).
on:
  push:
    branches: ['**']
  workflow_dispatch:
  # deploy-production reuses this workflow to build the release installers.
  workflow_call:

permissions:
  contents: read

concurrency:
  # why: github.workflow is the caller's name under workflow_call, so a deploy never cancels a push build.
  group: ${{ github.workflow }}-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            exe: release/linux-unpacked/the-incubator
            test-exe: release-test/linux-unpacked/the-incubator
            display: xvfb-run -a
          - os: macos-latest
            exe: release/mac-arm64/The Incubator.app/Contents/MacOS/The Incubator
            test-exe: release-test/mac-arm64/The Incubator.app/Contents/MacOS/The Incubator
            display: ''
          - os: windows-latest
            exe: release/win-unpacked/The Incubator.exe
            test-exe: release-test/win-unpacked/The Incubator.exe
            display: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @incubator/web build:ui
      - name: Test build (fakes behind the launch flag), unpacked
        run: pnpm --filter @incubator/desktop dist:test
        env:
          INCUBATOR_TEST_BUILD: '1'
      - name: Release build and installers
        run: pnpm --filter @incubator/desktop dist
      # why: Ubuntu runners restrict unprivileged user namespaces, so Chromium falls back to its setuid
      # sandbox helper, which must be root-owned with mode 4755 (the .deb install does the same).
      - name: Set up the Chromium sandbox helper (Linux)
        if: runner.os == 'Linux'
        run: |
          for d in apps/desktop/release/linux-unpacked apps/desktop/release-test/linux-unpacked; do
            sudo chown root:root "$d/chrome-sandbox"
            sudo chmod 4755 "$d/chrome-sandbox"
          done
      - name: Smoke-test the packaged executables
        shell: bash
        run: ${{ matrix.display }} pnpm test:desktop-smoke
        env:
          INCUBATOR_DESKTOP_EXE: ${{ github.workspace }}/apps/desktop/${{ matrix.exe }}
          INCUBATOR_DESKTOP_TEST_EXE: ${{ github.workspace }}/apps/desktop/${{ matrix.test-exe }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: the-incubator-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 14
          path: |
            apps/desktop/release/*.AppImage
            apps/desktop/release/*.deb
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
