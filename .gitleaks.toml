# gitleaks configuration: the default rules plus narrowly scoped allowances for test data.
# Each allowance matches one known shape of non-secret value; real secrets never match these.
title = "the-incubator"

[extend]
useDefault = true

[[allowlists]]
description = "Recorded LLM fixtures are keyed by the SHA-256 of the request (packages/core/fixtures)."
regexTarget = "line"
regexes = ['''^\s*"key": "[0-9a-f]{64}",?$''']

[[allowlists]]
description = "Fake keys in test history: keychain/env precedence (llm tests) and an early Leantime tracker test."
regexTarget = "match"
regexes = ['''(?:env|kc)-key-123456''', '''lt_api_key_secret_1234''']

[[allowlists]]
description = "Tests use fake secrets named test-secret-*; real secrets never carry that prefix."
regexTarget = "match"
regexes = ['''test-secret-[A-Za-z0-9_-]+''']
